name: WaliT
options:
  bundleIdPrefix: com.walit
  deploymentTarget:
    iOS: "17.0"
targets:
  WalitHashEngine:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: cpp
    settings:
      base:
        DEFINES_MODULE: YES
        MODULEMAP_FILE: cpp/module.modulemap
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        CLANG_CXX_LIBRARY: "libc++"
        SKIP_INSTALL: YES
        PRODUCT_NAME: WalitHashEngine
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"

  WaliT:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaliT
    dependencies:
      - target: WalitHashEngine
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walit.app
        SWIFT_VERSION: "5.10"
        SWIFT_CXX_INTEROPERABILITY_MODE: default
        _SWIFT_EXPLICIT_MODULES_ALLOW_CXX_INTEROP: YES
        OTHER_SWIFT_FLAGS: "-Xcc -ObjC++"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: WaliT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
